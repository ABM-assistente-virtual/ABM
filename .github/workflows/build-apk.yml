name: ABM 8.0.2 APK Builder

'on':
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Extract ABM project
        run: |
          unzip -o ABM_8_0_2_BUILD_READY_SEM_APK.zip
          test -f abm_708_work/project/settings.gradle
          test -f abm_708_work/project/app/build.gradle

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build ABM APK
        working-directory: abm_708_work/project
        run: |
          gradle --no-daemon assembleDebug --stacktrace

      - name: Upload ABM APK
        uses: actions/upload-artifact@v4
        with:
          name: ABM-8.0.2-APK
          path: abm_708_work/project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
