name: ABM 8.0.2 APK Builder

on: [push, workflow_dispatch]

permissions:
  contents: read

env:
  ANDROID_HOME: /usr/local/lib/android/sdk

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract ABM project
        run: |
          unzip -o ABM_8_0_2_BUILD_READY_SEM_APK.zip
          test -f abm_708_work/project/settings.gradle
          test -f abm_708_work/project/app/build.gradle

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK components
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)
          if [ -z "$SDKMANAGER" ]; then
            echo "ERRO: sdkmanager não encontrado."
            exit 1
          fi
          echo "SDK Manager encontrado: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build ABM APK
        working-directory: abm_708_work/project
        run: gradle --no-daemon assembleDebug --stacktrace

      - name: Upload ABM APK
        uses: actions/upload-artifact@v4
        with:
          name: ABM-8.0.2-APK
          path: abm_708_work/project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
